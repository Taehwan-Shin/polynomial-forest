<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="description" content="다항식을 풀며 숲을 탐험하고 내 계정에 학습 기록을 보관하세요."><title>다항식 숲 탐험</title><link rel="icon" href="./assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./polynomial.css"><link rel="stylesheet" href="./cloud.css"><script type="module" src="./app.mjs"></script></head>
<body><a class="skip-link" href="#main">본문으로 바로 가기</a><header class="site-header"><a class="brand" href="https://taehwan-shin.github.io/classroom-hub/"><img src="./assets/mark.svg" alt="" width="36" height="36"><span>교실 도구 허브</span></a><span class="header-note">다항식 숲 탐험</span></header><section id="account" class="account-panel" aria-label="학습 계정"><form id="account-form"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required pattern="[A-Za-z][A-Za-z0-9_]{3,23}" minlength="4" maxlength="24" placeholder="영문·숫자·밑줄 4~24자"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="72"><label for="password-confirm">비밀번호 확인 <small>(가입할 때만)</small></label><input id="password-confirm" type="password" autocomplete="new-password" maxlength="72"><div class="account-actions"><button id="sign-in" type="submit" class="primary-button">로그인</button><button id="sign-up" type="button">계정 만들기</button><button id="forgot" type="button">비밀번호를 잊었어요</button></div><p>실명·학교·학번 대신 별명을 사용하세요. 비밀번호는 12자 이상이며 다른 서비스와 다르게 정하세요.</p></form><button id="logout" hidden>로그아웃</button><p id="account-status" role="status" aria-live="polite">로그인하면 다른 기기에서도 내 학습 기록을 이어갈 수 있어요.</p></section><main id="main" tabindex="-1"></main><footer class="site-footer"><span>한 걸음씩 풀고, 함께 성장해요.</span><a href="./privacy.html">개인정보 및 기록 안내</a></footer><noscript>JavaScript를 켜주세요.</noscript></body></html>
